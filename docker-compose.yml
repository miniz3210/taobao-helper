version: '3.8'

services:
  taobao-helper:
    build: .
    container_name: taobao-helper
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - TZ=Asia/Hong_Kong
      - DATABASE_URL=sqlite:///./data/taobao_helper.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
